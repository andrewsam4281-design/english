<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Test: Chapters 1 and 2 (Grammar–VIII)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--text:#1f2433;--muted:#5d6579;--accent:#3a56d4;--line:#dfe3ee;--ok:#1b8a4b;--okbg:#e4f6ec;--bad:#c23b3b;--badbg:#fdeaea;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1e212b;--text:#e8eaf2;--muted:#a0a7bb;--accent:#8ea2ff;--line:#2f3445;--ok:#5fd18c;--okbg:#17301f;--bad:#ff8a8a;--badbg:#3a1d1d;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.85 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:800px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2em 0}
.meta{color:var(--muted);font-size:.92rem;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.ch{font-size:1.25rem;font-weight:700;margin:32px 0 0;padding-bottom:6px;border-bottom:2px solid var(--accent)}
h2{font-size:1.05rem;margin:0 0 12px;color:var(--accent);line-height:1.5}
.q{padding:6px 10px;border-radius:10px;margin:6px 0;display:flex;gap:8px;align-items:baseline}
.q .n{font-weight:600;min-width:1.8em}
.q.ok{background:var(--okbg)}.q.bad{background:var(--badbg)}
.body{flex:1;min-width:0}
.row{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-top:2px}
.row span{font-size:.9rem;color:var(--muted);white-space:nowrap}
input[type=text],select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;width:7em;max-width:100%}
input.w{flex:1;width:auto;min-width:12em}
select{width:auto;min-width:5.5em}
select.f{width:100%;margin-top:2px}
.fb{font-size:.88rem;line-height:1.4;color:var(--bad);margin-top:2px}
.q.ok .fb{color:var(--ok)}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#result{display:none;text-align:center;line-height:1.5}
#result .big{font-size:2.2rem;font-weight:700}
#name{width:100%}
</style>
</head>
<body>
<main>
<h1>Online Test: Chapters 1 and 2</h1>
<div class="meta">GRAMMAR–VIII · Chapter 1: Determiners · Chapter 2: Verbs Expressing the Present Tense · 1 mark for each blank, sentence or match</div>
<div class="card"><label>Your name<br><input type="text" id="name" placeholder="Enter your name"></label></div>
<div id="result" class="card"></div>
<div id="test"></div>
<div class="bar"><button id="submit">Submit test</button><button class="alt" id="reset">Reset</button></div>
</main>
<script>
const CH=["Chapter 1: Determiners","Chapter 2: Verbs Expressing the Present Tense (Simple Present and Present Continuous)"];
const A=["a","an","the","X"];
const BB=["give advice to a crowd.","saves nine.","over spilt milk.","wait for no man.","begins at home.","seldom bite.","we change.","flock together.","gathers no moss.","makes much noise."];
const L="abcdefghij";
const S=[
{c:0,t:"1. Fill in the blanks with ‘a’, ‘an’ or ‘the’. Put a cross (X) where no article is needed.",k:"sel",o:A,q:[
["___ gold is ___ precious metal.","x","a"],
["This bicycle cost me ___ hundred rupees.","a"],
["___ health in villages can be improved by sanitation.","x"],
["___ umbrella protects us from ___ rain.","an","the"],
["___ time is money. Do not waste it.","x"],
["I met ___ European on my way to ___ college.","a","x"],
["___ teachers of this school are highly qualified.","the"],
["There is ___ empty bottle on ___ table.","an","the"],
["Milk is sold by ___ litre.","the"],
["What is ___ time by your watch?","the"],
["___ moon goes round ___ earth.","the","the"],
["Tell ___ peon to bring me ___ glass of water.","the","a"]]},
{c:0,t:"2. Fill in the blanks by choosing the correct determiners from those given in brackets:",k:"selq",q:[
["___ man should do his duty.","every",["one","some","every","no","any"]],
["I have not ___ money.","any",["no","some","a few","many","any"]],
["They have ___ wealth.","much",["much","many","any few","a few"]],
["___ people were killed in the Second World War.","many",["many","a few","some","any"]],
["___ days’ rest did him much good.","a few",["a few","few","the few","much","a little"]],
["___ knowledge is a dangerous thing.","a little",["little","the little","a few","much","a little"]]]},
{c:0,t:"3. Fill in the blanks with suitable determiners:",k:"txt",q:[
["Have you ___ money to buy a car?","any"],
["___ students should work hard.","all"],
["___ husband and wife are intelligent.","both"],
["I cannot write with this pen, so give me the ___ one.","other"],
["Children come out with ___ lame excuse.",["some","any","many"]],
["___ team could score a goal.","neither"],
["There is ___ milk in the milk-pot to make a cup of tea.","some"],
["___ water that was in the pot has been spilt.",["some","all","the"]],
["He ate both the oranges. ___ orange was sweet, ___ sour.","one",["the other","other"]],
["Don’t you have ___ relatives in Chandigarh?","any"],
["Anita resembles ___ sister.","her"],
["How ___ mangoes are there in the box?","many"],
["The patient lay unconscious for ___ hour and ___ half.","an","a"],
["Whales are ___ largest animals in ___ sea. We know that ___ largest animals on land are elephants. But, compared to ___ whale, ___ elephant is ___ tiny creature. If we put ___ elephant by ___ side of ___ whale it would look like ___ cat except for ___ shape.","the","the","the","the","the","a",["an","one"],"the","a","a","the"],
["___ next day, soon after they had set out, they found themselves in ___ lonely part of ___ country. ___ road ran through ___ dried-up river course and on ___ side of them rose cliffs, rugged, rocky cliffs which seemed to cut them off from ___ sight and sound of ___ other human beings. It was ___ hot day, ___ air was still, and ___ sun, shining down on them, seemed to set them on fire. Nor were there ___ trees to give ___ shade. So they walked on.","the","a","the","the","a","the","the","any","a","the","the","any",["them","any","some"]]]},
{c:1,t:"1. Fill in the blanks with the Simple Present Tense form of the Verbs given in brackets:",k:"txt",q:[
["Trees ___ on the ground. (grow)","grow"],
["The sun ___. (shine)","shines"],
["I ___ in Delhi but my brother ___ in Dehradun. (live)","live","lives"],
["The earth ___ round the sun. (go)","goes"],
["He always ___ the shop at 6 o’clock in the morning. (open)","opens"],
["We ___ a lot of different things in our free time. (do)","do"],
["The City Museum ___ at 5 o’clock every evening. (close)","closes"],
["Loveleen ___ very interesting stories. (write)","writes"],
["She ___ the piano very well. (play)","plays"],
["My watch ___ fifteen seconds a day. (lose)","loses"]]},
{c:1,t:"2. Rewrite the following sentences changing the verbs into Negative, Interrogative and Negative Interrogative:",k:"tri",q:[
["You know her address.","You do not know her address.","Do you know her address?","Don’t you know her address?"],
["Anu does her work sincerely.","Anu does not do her work sincerely.","Does Anu do her work sincerely?","Doesn’t Anu do her work sincerely?"],
["These girls learn music everyday.","These girls do not learn music everyday.","Do these girls learn music everyday?","Don’t these girls learn music everyday?"],
["He likes to play football.","He does not like to play football.","Does he like to play football?","Doesn’t he like to play football?"],
["He smokes cigarettes.","He does not smoke cigarettes.","Does he smoke cigarettes?","Doesn’t he smoke cigarettes?"],
["It rains a lot where you live.","It does not rain a lot where you live.","Does it rain a lot where you live?","Doesn’t it rain a lot where you live?"],
["I drink a lot of tea.","I do not drink a lot of tea.","Do I drink a lot of tea?","Don’t I drink a lot of tea?"],
["The dog barks at visitors.","The dog does not bark at visitors.","Does the dog bark at visitors?","Doesn’t the dog bark at visitors?"],
["He works hard for his examinations.","He does not work hard for his examinations.","Does he work hard for his examinations?","Doesn’t he work hard for his examinations?"]]},
{c:1,t:"3. Match words in Column A with those in Column B and write complete sentences:",k:"match",q:[
["Charity","e"],["Never","a"],["Things do not change","g"],["A rolling stone","i"],["A stitch in time","b"],["An empty vessel","j"],["Don’t cry","c"],["Time and tide","d"],["Barking dogs","f"],["Birds of a feather","h"]]},
{c:1,t:"4. Fill in the blanks with the Simple Present or the Present Continuous forms of the Verbs given in the brackets. Choose the form of each Verb according to the meaning of the sentence:",k:"txt",q:[
["The boys generally ___ to their uncle’s house for the holidays, but this year they ___ there. (go, not go)","go","are not going"],
["My nephews ___ here tomorrow. They usually ___ their vacation here. (arrive, spend)","are arriving","spend"],
["He generally ___ a grey suit, but today he ___ a white one. (wear, wear)","wears","is wearing"],
["He rarely ___ an umbrella, but he ___ one now. (carry, carry)","carries","is carrying"],
["Ravi ___ his homework still. His brother who always ___ faster has finished his and ___ in the garden. (do, work, jog)","is doing","works","is jogging"],
["I ___ you ___ a copy of Airport. How do you like the book? (notice, have)","notice","have"],
["You ___ to enjoy this film; I don’t really. (seem)","seem"],
["I usually ___ to school. But today I ___ in my brother’s car. (walk, go)","walk","am going"]]}
];
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/n't\b/g," not").replace(/[^a-z0-9]/g,"");
const acc=a=>Array.isArray(a)?a:[a];
const test=document.getElementById("test");
let units=[];
function inp(cls){const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="none";if(cls)t.className=cls;return t;}
function mk(c,s,q,qi){
 const d=document.createElement("div");d.className="q";
 const n=document.createElement("span");n.className="n";n.textContent=(qi+1)+".";
 const b=document.createElement("div");b.className="body";
 d.append(n,b);c.appendChild(d);
 const u={d,b,ctls:[],ans:[],k:s.k,q,c:s.c};
 if(s.k==="tri"){
  b.append(q[0]);
  ["Negative","Interrogative","Negative Interrogative"].forEach((lab,i)=>{
   const r=document.createElement("div");r.className="row";
   const sp=document.createElement("span");sp.textContent="("+lab+")";
   const t=inp("w");r.append(sp,t);b.appendChild(r);u.ctls.push(t);u.ans.push(q[i+1]);
  });
 }else if(s.k==="match"){
  b.append(q[0]);
  const t=document.createElement("select");t.className="f";
  t.innerHTML='<option value="">Select the matching words from Column B</option>'+BB.map((x,i)=>`<option value="${L[i]}">(${L[i]}) ${x}</option>`).join("");
  b.appendChild(t);u.ctls.push(t);u.ans.push(q[1]);
 }else{
  const p=q[0].split("___");
  b.append(p[0]);
  for(let i=1;i<p.length;i++){
   let t;
   if(s.k==="txt")t=inp();
   else{
    t=document.createElement("select");
    const opts=s.k==="sel"?s.o:q[2];
    t.innerHTML='<option value="">Select</option>'+opts.map(o=>`<option>${o}</option>`).join("");
   }
   u.ctls.push(t);u.ans.push(s.k==="selq"?q[1]:q[i]);b.append(t,p[i]);
  }
 }
 units.push(u);
}
function build(){
 test.innerHTML="";units=[];
 let last=-1;
 S.forEach(s=>{
  if(s.c!==last){const h=document.createElement("div");h.className="ch";h.textContent=CH[s.c];test.appendChild(h);last=s.c;}
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<h2>${s.t}</h2>`;
  s.q.forEach((q,i)=>mk(c,s,q,i));
  test.appendChild(c);
 });
}
const show=a=>acc(a).map(x=>x==="x"?"X":x).join(" / ");
document.getElementById("submit").onclick=()=>{
 const sc=[0,0],tt=[0,0];
 units.forEach(u=>{
  let all=true;
  u.ctls.forEach((c,i)=>{
   tt[u.c]++;
   const ok=u.k==="match"?c.value===u.ans[i]:acc(u.ans[i]).map(norm).includes(norm(c.value));
   if(ok)sc[u.c]++;else all=false;
   c.disabled=true;
  });
  u.d.classList.remove("ok","bad");u.d.classList.add(all?"ok":"bad");
  let fb=u.b.querySelector(".fb");if(!fb){fb=document.createElement("div");fb.className="fb";u.b.appendChild(fb);}
  if(all)fb.textContent="Correct";
  else if(u.k==="match")fb.textContent="Answer: "+u.q[0]+" "+BB[L.indexOf(u.q[1])];
  else fb.textContent="Answer: "+u.ans.map((a,i)=>(u.ans.length>1&&u.k!=="tri"?(i+1)+") ":"")+show(a)).join(u.k==="tri"?"  |  ":"  ");
 });
 const score=sc[0]+sc[1],total=tt[0]+tt[1];
 const r=document.getElementById("result"),nm=document.getElementById("name").value.trim();
 const p=Math.round(score/total*100);
 r.style.display="block";
 r.innerHTML=`<div>${nm?nm+", your":"Your"} score</div><div class="big">${score} / ${total}</div><div class="meta">Chapter 1: ${sc[0]} / ${tt[0]} · Chapter 2: ${sc[1]} / ${tt[1]}<br>${p}% · ${p>=80?"Excellent work!":p>=60?"Good effort. Review the marked answers.":"Keep practising. Check the answers below."}</div>`;
 window.scrollTo({top:0,behavior:"smooth"});
};
document.getElementById("reset").onclick=()=>{build();document.getElementById("result").style.display="none";window.scrollTo({top:0,behavior:"smooth"});};
build();
</script>
</body>
</html>

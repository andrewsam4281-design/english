<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Test: Articles and Determiners (Class VIII)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--text:#1f2433;--muted:#5d6579;--accent:#3a56d4;--line:#dfe3ee;--ok:#1b8a4b;--okbg:#e4f6ec;--bad:#c23b3b;--badbg:#fdeaea;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1e212b;--text:#e8eaf2;--muted:#a0a7bb;--accent:#8ea2ff;--line:#2f3445;--ok:#5fd18c;--okbg:#17301f;--bad:#ff8a8a;--badbg:#3a1d1d;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2em 0}
.meta{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
h2{font-size:1.1rem;margin:0 0 4px;color:var(--accent)}
.ins{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.q{padding:8px 10px;border-radius:10px;margin:4px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.q .n{font-weight:600;min-width:1.6em}
.q.ok{background:var(--okbg)}.q.bad{background:var(--badbg)}
input[type=text],select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:90px;max-width:100%}
input.wide{width:100%;min-width:0;margin-top:4px}
.sentence{flex:1;min-width:200px}
.fb{width:100%;font-size:.88rem;padding-left:2.1em;color:var(--bad)}
.q.ok .fb{color:var(--ok)}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:10px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
#result{display:none;text-align:center}
#result .big{font-size:2.2rem;font-weight:700}
.nm{width:100%;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>Online Test: Articles and Determiners</h1>
<div class="meta">English Grammar · Class VIII · 35 marks · 1 mark each</div>
<div class="card"><label>Your name<br><input class="wide" type="text" id="name" placeholder="Enter your name"></label></div>
<div id="result" class="card"></div>
<div id="test"></div>
<div class="bar"><button id="submit">Submit test</button><button class="alt" id="reset">Reset</button></div>
</main>
<script>
const A=["a","an","the","X"];
const S=[
{t:"Section A: Articles",i:"Choose ‘a’, ‘an’ or ‘the’. Choose X where no article is needed.",k:"sel",o:A,q:[
["___ sun rises in the east.","the"],["She is ___ honest girl.","an"],["___ honesty is the best policy.","x"],["My brother bought ___ umbrella yesterday.","an"],["___ Ganga is a sacred river.","the"],["He plays ___ guitar very well.","the"],["I saw ___ one-eyed man at the gate.","a"],["___ gold and silver are precious metals.","x"],["Rohan is ___ tallest boy in our class.","the"],["We waited for ___ hour.","an"]]},
{t:"Section B: Choosing Determiners",i:"Choose the correct determiner from the options.",k:"sel",q:[
["___ child needs love.","every",["every","all","many"]],["We have ___ friends in this city, so we feel lonely.","few",["few","little","much"]],["He has ___ interest in music.","much",["many","much","a few"]],["Would you like ___ tea?","some",["some","many","few"]],["I did not buy ___ vegetables.","any",["any","some","a few"]],["___ of the two boys was selected.","neither",["Both","Neither","All"]],["She has two sons. ___ are doctors.","both",["Both","Either","Every"]],["___ water is left in the bottle.","a little",["A few","Many","A little"]],["Take ___ one of these two pens.","either",["either","all","many"]],["___ people were present at the meeting.","several",["Much","Several","Every"]]]},
{t:"Section C: Suitable Determiners",i:"Type one suitable determiner in each blank.",k:"txt",q:[
["Do you have ___ questions?",["any"]],["___ student must carry an identity card.",["every","each"]],["___ the players were tired after the match.",["all"]],["One brother is a pilot; the ___ is an engineer.",["other"]],["I need ___ sugar for the cake.",["some"]],["How ___ books are there on the shelf?",["many"]],["___ of the two answers is correct.",["neither","either"]],["He earned ___ money to buy a bicycle.",["enough"]],["Anita lost ___ pen, so she borrowed mine.",["her"]],["___ boys were playing and the others were reading.",["some"]]]},
{t:"Section D: Error Correction",i:"Rewrite each sentence correctly.",k:"fix",q:[
["He is a honest man.",["he is an honest man"],"He is an honest man."],["Ganga is the longest river of India.",["the ganga is the longest river of india"],"The Ganga is the longest river of India."],["I have few money.",["i have little money"],"I have little money."],["Every students must attend the class.",["every student must attend the class"],"Every student must attend the class."],["She gave me an advice.",["she gave me a piece of advice","she gave me some advice"],"She gave me a piece of advice."]]}
];
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const test=document.getElementById("test");
let items=[];
function build(){
 test.innerHTML="";items=[];
 S.forEach((s,si)=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<h2>${s.t}</h2><p class="ins">${s.i}</p>`;
  s.q.forEach((q,qi)=>{
   const d=document.createElement("div");d.className="q";
   const n=document.createElement("span");n.className="n";n.textContent=(qi+1)+".";d.appendChild(n);
   let ctl,box=document.createElement("span");box.className="sentence";
   if(s.k==="fix"){
    box.textContent=q[0];
    ctl=document.createElement("input");ctl.type="text";ctl.className="wide";ctl.placeholder="Write the corrected sentence";
    box.appendChild(document.createElement("br"));box.appendChild(ctl);
   }else{
    const parts=q[0].split("___");
    if(s.k==="sel"){
     ctl=document.createElement("select");
     const opts=s.o||q[2];
     ctl.innerHTML='<option value="">Select</option>'+opts.map(o=>`<option>${o}</option>`).join("");
    }else{ctl=document.createElement("input");ctl.type="text";ctl.autocomplete="off";ctl.autocapitalize="none";}
    box.append(parts[0],ctl,parts[1]);
   }
   d.appendChild(box);c.appendChild(d);
   items.push({s,q,ctl,d});
  });
  test.appendChild(c);
 });
}
function check(it){
 const v=it.ctl.value,k=it.s.k;
 if(k==="sel")return norm(v)===norm(it.q[1]);
 if(k==="txt")return it.q[1].includes(norm(v));
 return it.q[1].includes(norm(v));
}
function shown(it){
 const k=it.s.k;
 if(k==="sel")return it.q[1]==="x"?"X":it.q[1];
 if(k==="txt")return it.q[1].join(" / ");
 return it.q[2];
}
document.getElementById("submit").onclick=()=>{
 let score=0;
 items.forEach(it=>{
  const ok=check(it);if(ok)score++;
  it.d.classList.remove("ok","bad");it.d.classList.add(ok?"ok":"bad");
  let fb=it.d.querySelector(".fb");if(!fb){fb=document.createElement("div");fb.className="fb";it.d.appendChild(fb);}
  fb.textContent=ok?"Correct":"Answer: "+shown(it);
  it.ctl.disabled=true;
 });
 const r=document.getElementById("result"),nm=document.getElementById("name").value.trim();
 const p=Math.round(score/35*100);
 r.style.display="block";
 r.innerHTML=`<div>${nm?nm+", your":"Your"} score</div><div class="big">${score} / 35</div><div class="meta">${p}% · ${p>=80?"Excellent work!":p>=60?"Good effort. Review the marked answers.":"Keep practising. Check the answers below."}</div>`;
 window.scrollTo({top:0,behavior:"smooth"});
};
document.getElementById("reset").onclick=()=>{build();document.getElementById("result").style.display="none";window.scrollTo({top:0,behavior:"smooth"});};
build();
</script>
</body>
</html>
